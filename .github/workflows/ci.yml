# Run tests on every push/PR, and fail if secrets appear in product code.
# Test fixtures and known detector.py contextual FPs are listed in
# .secret-scanner-ignore — not hidden with --severity.
# Terminal output is masked; plaintext secret values are never printed or logged.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest

  secret-scan:
    name: scan product code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan for leaked secrets
        # Dogfood the composite action (stdlib scan, --no-color in Action logs).
        # Allowlist: .secret-scanner-ignore. Checkout is clean, so --staged is empty.
        uses: ./
        with:
          include-hidden: true
