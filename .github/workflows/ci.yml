# Run tests on every push/PR, and fail if HIGH+ secrets appear in product code.
# Test fixtures contain fake keys on purpose — they are excluded until allowlist exists.
# Terminal output is masked; plaintext secret values are never printed or logged.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest

  secret-scan:
    name: scan product code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for leaked secrets
        # Stdlib only — pytest is not required to run the scanner.
        # --exclude tests: fixtures use fake AWS/PEM values so the suite can assert detection.
        # --severity HIGH: ignore MEDIUM contextual hits in detector.py until allowlist exists.
        # After checkout the tree is clean, so --staged / --changed would scan nothing.
        run: >
          python main.py .
          --no-color
          --include-hidden
          --exclude tests
          --severity HIGH
