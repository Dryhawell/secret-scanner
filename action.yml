name: Secret Scanner
description: Scan the workspace for leaked secrets. Findings are masked; plaintext is never printed.
author: Dryhawell
branding:
  icon: shield
  color: gray-dark

inputs:
  path:
    description: Directory or file to scan (workspace-relative). Must not look like a CLI flag.
    required: false
    default: "."
  include-hidden:
    description: Scan hidden directories such as .github (never .git / .venv)
    required: false
    default: "false"
  severity:
    description: Minimum severity to report (LOW, MEDIUM, HIGH, or CRITICAL)
    required: false
    default: "LOW"
  fail-on-severity:
    description: Minimum severity that fails the job (empty = same as severity)
    required: false
    default: ""
  max-file-size:
    description: Skip files larger than N mebibytes (empty = CLI default 5; 0 = unlimited; max 1024)
    required: false
    default: ""
  min-confidence:
    description: Hide findings below this confidence (0-99; empty = CLI default 0)
    required: false
    default: ""
  skip-pattern:
    description: Rule names to disable (comma or newline separated; empty = none)
    required: false
    default: ""
  only-pattern:
    description: Only run these rules (comma or newline separated; empty = all; applied before skip-pattern)
    required: false
    default: ""
  glob:
    description: Only scan files matching these globs (comma or newline separated; empty = all files)
    required: false
    default: ""
  skip-glob:
    description: Skip files matching these globs (comma or newline separated; empty = none)
    required: false
    default: ""
  exclude:
    description: Extra directory names to skip (comma or newline separated; empty = none)
    required: false
    default: ""
  jobs:
    description: Worker threads for file scans (empty = CLI default 1; 0 = CPU count; max 32)
    required: false
    default: ""
  python-version:
    description: Python version for actions/setup-python (3.11 or newer)
    required: false
    default: "3.12"
  quiet:
    description: Suppress the text report (exit code still 1 on findings)
    required: false
    default: "false"
  verbose:
    description: Write DEBUG per-file lines to the log file (secrets stay unlogged)
    required: false
    default: "false"
  sarif:
    description: Write SARIF and upload to GitHub code scanning (needs security-events: write)
    required: false
    default: "false"
  sarif-file:
    description: Workspace-relative SARIF path (only used when sarif is true)
    required: false
    default: "secret-scanner.sarif"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Scan for leaked secrets
      shell: bash
      env:
        SECRET_SCANNER_ROOT: ${{ github.action_path }}
        SECRET_SCANNER_PATH: ${{ inputs.path }}
        SECRET_SCANNER_INCLUDE_HIDDEN: ${{ inputs.include-hidden }}
        SECRET_SCANNER_SEVERITY: ${{ inputs.severity }}
        SECRET_SCANNER_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        SECRET_SCANNER_MAX_FILE_SIZE: ${{ inputs.max-file-size }}
        SECRET_SCANNER_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        SECRET_SCANNER_SKIP_PATTERN: ${{ inputs.skip-pattern }}
        SECRET_SCANNER_ONLY_PATTERN: ${{ inputs.only-pattern }}
        SECRET_SCANNER_GLOB: ${{ inputs.glob }}
        SECRET_SCANNER_SKIP_GLOB: ${{ inputs.skip-glob }}
        SECRET_SCANNER_EXCLUDE: ${{ inputs.exclude }}
        SECRET_SCANNER_JOBS: ${{ inputs.jobs }}
        SECRET_SCANNER_QUIET: ${{ inputs.quiet }}
        SECRET_SCANNER_VERBOSE: ${{ inputs.verbose }}
        SECRET_SCANNER_SARIF: ${{ inputs.sarif }}
        SECRET_SCANNER_SARIF_FILE: ${{ inputs.sarif-file }}
      run: python "$SECRET_SCANNER_ROOT/cli/github_action.py"

    - name: Upload SARIF
      if: ${{ always() && inputs.sarif == 'true' && hashFiles(inputs.sarif-file) != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: secret-scanner
